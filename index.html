<!DOCTYPE html>

<title>중국 이슈 다이제스트 · 아카이브</title>
<style>
  :root{--ink:#1a1d24;--sub:#5a6172;--line:#e5e8ee;--bg:#f7f8fa;--card:#fff;--accent:#b0332a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px}

  header{padding:28px 0 20px;border-bottom:3px solid var(--ink);margin-bottom:24px}

  h1{font-size:26px;font-weight:800;letter-spacing:-0.5px}
  .meta{color:var(--sub);font-size:13px;margin-top:8px}
  .list{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 20px}
  .day{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
  .day:last-child{border-bottom:none}
  .day:hover .date{color:var(--accent)}
  .date{font-weight:800;font-size:16px}
  .day .desc{color:var(--sub);font-size:13.5px;margin-top:2px}
  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub);line-height:1.8}
</style>
</head>
